# The Python side of Forever Voiceover: the pipeline in tools/, packaged flat
# (tools/ is the module, no src/). Run anything with ./tools/run.sh, which is
# `uv run` inside the dev shell from flake.nix; uv.lock and .python-version pin
# what runs, flake.lock pins uv, ffmpeg and lua.
#
# The version here is the tools' own; the addon's is in ForeverVO/ForeverVO.toc
# and the voice packs are dated (tools/data/release_state.json).

[project]
name = "forever-vo"
version = "0.1.0"
description = "Voice pipeline for the Forever Voiceover addon: capture ingestion, voice references, Chatterbox generation, pack tables and releases"
readme = "README.md"
license = "MIT"
authors = [{ name = "Quinn Dougherty", email = "quinn@for-all.dev" }]
requires-python = ">=3.12,<3.13"   # what .python-version and uv.lock pin; 3.13+ would resolve a different torch
dependencies = [
    "pydantic>=2.13.5",
    "requests",
    "requests-toolbelt",   # streams the pack upload to CurseForge from disk
    "tomlkit>=0.13",       # the audition page edits forever-vo.toml without losing its comments
    "typer>=0.27.2",
]

# The GPU stack is a group rather than a plain dependency so a checkout that
# only ingests, decodes exports or releases packs can skip the ~3 GB of torch:
# `uv run --no-group tts tools/ingest.py`. It is on by default because the
# owner's machine, where every script runs, generates audio nightly.
[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.84",
]
tts = [
    "chatterbox-tts==0.1.7",   # every voice so far was generated on this release; bump on purpose
    "setuptools<81",           # perth (chatterbox's watermarker) still imports pkg_resources
    "fastapi",                 # the audition page (uv run audition); both already come with chatterbox
    "uvicorn",
]
# Same Chatterbox pin, on PyTorch's ROCm 6.2.4 wheel instead of the PyPI CUDA
# wheel. The two groups conflict, so `uv lock` keeps both and the default stays
# `tts` (what the nightly run generates with). Audition on an AMD GPU:
#   UV_PROJECT_ENVIRONMENT=.venv-rocm ./tools/run.sh --no-group tts --group tts-rocm audition
# torch, torchaudio and pytorch-triton-rocm have to be named here: a source
# pinned to this group only applies to a direct member of it. Chatterbox's own
# pin is still torch==2.6.0; the +rocm6.2.4 local version satisfies it.
tts-rocm = [
    "chatterbox-tts==0.1.7",
    "setuptools<81",
    "fastapi",
    "uvicorn",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "pytorch-triton-rocm==3.2.0",
]

[project.scripts]
audition = "tools.audition:main"       # uv run audition: the local page for trying voices and settings
fvo-ingest = "tools.ingest:main"
fvo-generate = "tools.generate:main"
fvo-release-pack = "tools.release_pack:main"
fvo-export = "tools.exportfile:main"
fvo-classicdb = "tools.classicdb:main"
fvo-wdbcache = "tools.wdbcache:main"
fvo-apicheck = "tools.apicheck:main"
fvo-gender-check = "tools.gender_check:main"
fvo-textkey-parity = "tools.textkey_parity:main"
fvo-repair-sound-index = "tools.repair_sound_index:main"
fvo-build-voice-references = "tools.build_voice_references:main"
fvo-build-wc3-references = "tools.build_wc3_references:main"
fvo-build-retail-references = "tools.build_retail_references:main"
fvo-build-species-map = "tools.build_species_map:main"
fvo-voicecheck = "tools.voicecheck:main"
fvo-refclips = "tools.refclips:main"
fvo-soundpaths = "tools.soundpaths:main"
fvo-migrate-voice-names = "tools.migrate_voice_names:main"
fvo-extract-wc3-units = "tools.extract_wc3_units:main"
fvo-tts-smoke = "tools.tts_smoke:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["tts"]
conflicts = [
    [
        { group = "tts" },
        { group = "tts-rocm" },
    ],
]

[tool.uv.sources]
torch = [ { index = "pytorch-rocm", group = "tts-rocm" } ]
torchaudio = [ { index = "pytorch-rocm", group = "tts-rocm" } ]
pytorch-triton-rocm = [ { index = "pytorch-rocm", group = "tts-rocm" } ]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2.4"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""
module-name = "tools"
# Only the code is the package; the captures, indexes, DB2 caches, reference
# clips and shell wrappers under tools/ stay where they are on disk.
source-exclude = ["tools/data/**", "tools/voices/**", "tools/samples/**", "tools/*.sh", "tools/*.wav"]
wheel-exclude = ["tools/data/**", "tools/voices/**", "tools/samples/**", "tools/*.sh", "tools/*.wav"]
