# own pack file (by its file name, 415-accept, m-170-accept, 5688-19cbe7de) is drawn
# from that seed. `heard` is the line's fingerprint and `spoken` a hash of its exact
# text when the take was pinned; the pin stops applying when either changes, since
# the same seed under another text or tuning is another take. The pack is built on
# another GPU than the audition ran on, so there the seed draws a different take,
# though always the same one.
