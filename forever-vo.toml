[readers]
# The first addon release whose captures are taken at face value. Everything
# recorded by an earlier one (glued placeholders, no class or race, a lingering
# NPC unit, resolved $g branches) or by an unknown one loses the merge to a
# capture from this release on, whatever their order in time, and ingest.py
# keeps asking any reader for the line until such a capture arrives (needs_of).
# Raise it when a later release fixes what its predecessor recorded.
trusted_since = "0.1.4"

# The client resolves $n, $c and $r against whoever is reading before any addon
# can see the text, so a line first seen on a rogue is captured saying "rogue".
# Capture version 3 records the reader's class and race so ingest.py can put the
# placeholders back; these are the owner's characters whose captures predate it.
# Derived by aligning the captured text against the raw $c still held in
# tools/data/bulk/questcache.json (and confirmed by the owner for Agravain).
[readers.legacy."Myrlin Fixpoint"]
class = "Mage"
race = "Orc"    # added 2026-09-25: Mebok Mizzyrix's gossip was voiced "the orc I'm looking for"
[readers.legacy."Pellinore Fixpoint"]
class = "Hunter"
# No race on purpose: it is "Windshaper Skyborne", whose $r renders "skyborne",
# a word Forever's own text uses literally all over Zephras Isle. Those lines
# are repaired from the raw text where it exists and re-asked where it does not.
[readers.legacy."Agravain Fixpoint"]
class = "Rogue"
[readers.legacy."Fixpoint Fix"]
class = "Paladin"
race = "Undead"
[readers.legacy."Spron Limbertorque"]
race = "Gnome"    # a throwaway character: two lines from Sten Stoutarm, class unknown

# Community exports ("/fvo export") replace the reader's name with $n and carry
# no class or race, so a glued placeholder from a pre-whole-word client (issue
# #5) cannot be undone without help. Keyed by the capture file's origin (the
# issue comment id), holding what the poster told us. restore_name says the
# name is an ordinary English word ("It"), so the old client turned every such
# word into $n and ingest puts the word back wherever $n appears; otherwise
# only glued placeholders are undone.
[readers.community.comment-5768141361]
player = "It"
class = "Paladin"
restore_name = true

[release]
# The CurseForge website takes files up to 1 GB (the API less, see CLAUDE.md),
# and the Classic set with five alternate narrators was 1.36 GB, so it ships as
# two projects, cut by quest level: 1 to base_split_level with all gossip on
# one side (800 MB), the rest on the other (570 MB). With orc-male as the only
# alternate (2026-09-25) the whole set is about 1.08 GB, still over the cap, so
# the split stays. Cutting at 50 instead would put the first side back over it.
base_split_level = 40
# Release mp3s are mono at 22.05 kHz with no Xing/Info header frame (the
# client misreads that frame and stops the line early; see release_pack.py);
# 48k until 2026-09-22, when the base pack came to 1.3 GB with a third of the
# lines still to go. The working files under ForeverVO_Data/Sounds keep the
# generator's full quality, so this can go back up on any later build.
bitrate = "32k"
transcode_workers = 4

# CurseForge project IDs. The player addon's ID also lives in its TOC. The API
# key stays out of git (.env: CF_API_KEY, or CURSEFORGE_API_KEY).
[release.curseforge_projects]
addon = 1705010          # Forever Voiceover
delta = 1705094          # Forever Voiceover Data: Forever
base = 1705100           # Forever Voiceover Data: Base (Classic quests to level 40, all gossip)
base_endgame = 1709884   # Forever Voiceover Data: Base Endgame (Classic quests from 41)
